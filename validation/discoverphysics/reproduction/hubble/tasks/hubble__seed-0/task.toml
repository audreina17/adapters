schema_version = "1.3"
artifacts = [
  "/logs/verifier/reward.json",
  "/logs/verifier/inference-metadata.json",
  "/logs/verifier/reward.txt",
  "/logs/verifier/discoverphysics-result.json",
  "/logs/verifier/discoverphysics-experiments.json",
]

[task]
name = "discoverphysics/hubble__seed-0"
version = "1.0"
description = "Discover the governing law of a hidden simulated physical system"
authors = [
  { name = "Matt L. Wiemann", email = "matt.sampson@princeton.edu" },
  { name = "Lindsay M. Smith" },
  { name = "Peter Melchior" },
  { name = "Siddharth Mishra-Sharma" },
  { name = "Andrew Gordon Wilson" },
  { name = "Pavel Izmailov" },
  { name = "Carolina Cuesta-Lazaro" },
]
keywords = ["scientific-discovery", "physics", "experimentation", "reasoning"]

[metadata]
category = "scientific-discovery"
difficulty = "hard"
world = "hubble"
seed = 0
seed_pool_size = 4
noise_std = 0.32089328444204
world_variance = 41.189
world_index = 7
upstream_commit = "33b7fa9df96de9c35744efd181ca7e5a8dd60ad5"

[agent]
timeout_sec = 72000

[verifier]
timeout_sec = 9600
user = "root"

[verifier.env]
RESULT_TOKEN_FILE = "/run/discoverphysics-result/token"
WORLD_INDEX = "7"
NOISE_SEED = "0"
SEED_POOL_SIZE = "4"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
